<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="96" fill="#181411" />
  <rect x="16" y="16" width="480" height="480" rx="80" fill="#faf6ee" stroke="#181411" stroke-width="12" />
  
  <!-- Outer accent frame -->
  <rect x="40" y="40" width="432" height="432" rx="64" fill="none" stroke="#c83228" stroke-width="4" stroke-dasharray="16 8" />

  <!-- Microphone body -->
  <rect x="208" y="120" width="96" height="160" rx="48" fill="#181411" stroke="#181411" stroke-width="8" />
  <rect x="220" y="136" width="72" height="70" rx="36" fill="#322c27" />
  <line x1="228" y1="160" x2="284" y2="160" stroke="#faf6ee" stroke-width="4" stroke-linecap="round" />
  <line x1="228" y1="180" x2="284" y2="180" stroke="#faf6ee" stroke-width="4" stroke-linecap="round" />
  
  <!-- Mic cradle arc -->
  <path d="M168 224 C168 312, 344 312, 344 224" fill="none" stroke="#181411" stroke-width="20" stroke-linecap="round" />
  
  <!-- Stand & Base -->
  <line x1="256" y1="312" x2="256" y2="384" stroke="#181411" stroke-width="20" stroke-linecap="round" />
  <line x1="184" y1="384" x2="328" y2="384" stroke="#181411" stroke-width="24" stroke-linecap="round" />

  <!-- The "Broken / Glitch" Slash in Blood Red -->
  <line x1="120" y1="110" x2="392" y2="400" stroke="#c83228" stroke-width="26" stroke-linecap="round" />
  <line x1="120" y1="110" x2="392" y2="400" stroke="#faf6ee" stroke-width="6" stroke-linecap="round" stroke-dasharray="24 12" />

  <!-- Sound Waves Crossed Out -->
  <path d="M376 168 C396 186, 408 212, 408 240 C408 268, 396 294, 376 312" fill="none" stroke="#c83228" stroke-width="12" stroke-linecap="round" stroke-dasharray="10 8" />
  <path d="M136 168 C116 186, 104 212, 104 240 C104 268, 116 294, 136 312" fill="none" stroke="#c83228" stroke-width="12" stroke-linecap="round" stroke-dasharray="10 8" />
</svg>
